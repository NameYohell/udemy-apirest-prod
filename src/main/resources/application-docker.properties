spring.application.name=udemy-apirest-prod

server.port=8081

# Configuración de la base de datos para Docker
spring.datasource.url=jdbc:mysql://mysql:3306/bdd-apirest-prod
spring.datasource.username=root
spring.datasource.password=mipasswordsegura

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuración adicional para contenedores
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de conexión robusta
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5